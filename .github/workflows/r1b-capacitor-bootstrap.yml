name: R1-B Capacitor Bootstrap

on:
  push:
    branches:
      - mobi/capacitor-r1
    paths:
      - .github/workflows/r1b-capacitor-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout authorized branch
        uses: actions/checkout@v4
        with:
          ref: mobi/capacitor-r1
          fetch-depth: 0

      - name: Verify frozen ancestry and main isolation
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE="4fdba3456625afcac16f32a9cfd3cc9afd65f3af"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test "$(git rev-parse "$EXPECTED_BASE")" = "$EXPECTED_BASE"
          test "$(git rev-parse origin/main)" = "26bbdc4529ad7d814305ef0e22499e4ab5be75ca"
          echo "R1-B base and main isolation PASS"

      - name: Setup Node and Java
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create Capacitor foundation sources
        shell: bash
        run: |
          set -euo pipefail

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mercatax.ivupr",
            "appName": "MercaTax IVU PR",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1200,
                "launchAutoHide": true,
                "backgroundColor": "#111418"
              }
            }
          }
          EOF

          cat > src/mobile-native-entry.js <<'EOF'
          import { Capacitor } from '@capacitor/core';
          import { App } from '@capacitor/app';
          import { Browser } from '@capacitor/browser';
          import { Directory, Encoding, Filesystem } from '@capacitor/filesystem';
          import { LocalNotifications } from '@capacitor/local-notifications';
          import { Network } from '@capacitor/network';
          import { Preferences } from '@capacitor/preferences';
          import { Share } from '@capacitor/share';
          import { SplashScreen } from '@capacitor/splash-screen';

          const DB_NAME = 'mercatax-ivu-r1';
          const STORE_NAME = 'records';
          const SETTINGS_PREFIX = 'mt_setting_';
          let notificationPermission = 'default';

          function openStructuredStore() {
            return new Promise((resolve, reject) => {
              const request = indexedDB.open(DB_NAME, 1);
              request.onupgradeneeded = () => {
                const db = request.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
              };
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error || new Error('IndexedDB unavailable'));
            });
          }

          async function structuredStore(mode, action) {
            const db = await openStructuredStore();
            try {
              return await new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, mode);
                const store = tx.objectStore(STORE_NAME);
                let result;
                try { result = action(store); } catch (error) { reject(error); return; }
                if (result && typeof result.onsuccess !== 'undefined') {
                  result.onsuccess = () => resolve(result.result);
                  result.onerror = () => reject(result.error || new Error('IndexedDB request failed'));
                } else {
                  tx.oncomplete = () => resolve(result);
                  tx.onerror = () => reject(tx.error || new Error('IndexedDB transaction failed'));
                }
              });
            } finally {
              db.close();
            }
          }

          function normalizePermission(value) {
            if (value === 'granted') return 'granted';
            if (value === 'denied') return 'denied';
            return 'default';
          }

          const bridge = {
            platform: Capacitor.getPlatform(),
            isNative: Capacitor.isNativePlatform(),
            data: {
              get: (key) => structuredStore('readonly', (store) => store.get(String(key))),
              set: (key, value) => structuredStore('readwrite', (store) => store.put(value, String(key))),
              remove: (key) => structuredStore('readwrite', (store) => store.delete(String(key))),
              keys: () => structuredStore('readonly', (store) => store.getAllKeys()),
              clear: () => structuredStore('readwrite', (store) => store.clear())
            },
            settings: {
              get: async (key) => (await Preferences.get({ key: SETTINGS_PREFIX + key })).value,
              set: (key, value) => Preferences.set({ key: SETTINGS_PREFIX + key, value: String(value) }),
              remove: (key) => Preferences.remove({ key: SETTINGS_PREFIX + key })
            },
            notifications: {
              status: async () => {
                const status = await LocalNotifications.checkPermissions();
                notificationPermission = normalizePermission(status.display);
                return notificationPermission;
              },
              request: async () => {
                let status = await LocalNotifications.checkPermissions();
                if (normalizePermission(status.display) === 'default') status = await LocalNotifications.requestPermissions();
                notificationPermission = normalizePermission(status.display);
                return notificationPermission;
              },
              schedule: async ({ id, title, body, at }) => {
                const permission = await bridge.notifications.request();
                if (permission !== 'granted') return { ok: false, reason: 'permission-denied' };
                await LocalNotifications.schedule({
                  notifications: [{
                    id: Number(id),
                    title: String(title),
                    body: String(body),
                    schedule: at ? { at: new Date(at) } : undefined
                  }]
                });
                return { ok: true };
              }
            },
            files: {
              writeJson: async (fileName, value) => {
                const path = `MercaTax/${String(fileName).replace(/[^a-zA-Z0-9._-]/g, '-')}`;
                const result = await Filesystem.writeFile({
                  path,
                  data: JSON.stringify(value, null, 2),
                  directory: Directory.Documents,
                  encoding: Encoding.UTF8,
                  recursive: true
                });
                return { path, uri: result.uri };
              },
              writeText: async (fileName, text) => {
                const path = `MercaTax/${String(fileName).replace(/[^a-zA-Z0-9._-]/g, '-')}`;
                const result = await Filesystem.writeFile({
                  path,
                  data: String(text),
                  directory: Directory.Documents,
                  encoding: Encoding.UTF8,
                  recursive: true
                });
                return { path, uri: result.uri };
              },
              readText: async (path) => {
                const result = await Filesystem.readFile({ path, directory: Directory.Documents, encoding: Encoding.UTF8 });
                return String(result.data);
              }
            },
            share: {
              text: (title, text) => Share.share({ title: String(title), text: String(text), dialogTitle: String(title) }),
              file: (title, uri) => Share.share({ title: String(title), url: String(uri), dialogTitle: String(title) })
            },
            links: {
              openExternal: async (url) => {
                const parsed = new URL(String(url));
                if (!['http:', 'https:'].includes(parsed.protocol)) throw new Error('Unsupported external URL protocol');
                await Browser.open({ url: parsed.href });
                return true;
              }
            },
            lifecycle: {
              onChange: (callback) => App.addListener('appStateChange', callback)
            },
            network: {
              status: () => Network.getStatus(),
              onChange: (callback) => Network.addListener('networkStatusChange', callback)
            }
          };

          window.MercaTaxNative = bridge;

          async function installNativeOverrides() {
            if (!bridge.isNative) return;

            try { notificationPermission = await bridge.notifications.status(); } catch (_) { notificationPermission = 'default'; }

            window.notificationState = () => notificationPermission;
            window.requestPushPermission = async () => {
              try {
                notificationPermission = await bridge.notifications.request();
                if (typeof window.updateNotificationButton === 'function') window.updateNotificationButton();
                if (notificationPermission === 'granted') {
                  if (typeof window.toast === 'function') window.toast('Notificaciones locales activadas');
                } else if (typeof window.showNotificationHelp === 'function') {
                  window.showNotificationHelp();
                }
              } catch (_) {
                if (typeof window.showNotificationHelp === 'function') window.showNotificationHelp();
              }
            };
            window.showNotificationHelp = () => {
              const title = notificationPermission === 'denied' ? 'Notificaciones bloqueadas' : 'Notificaciones no disponibles';
              const body = notificationPermission === 'denied'
                ? '<p>Las notificaciones locales están bloqueadas para MercaTax IVU PR.</p><p>Abre los Ajustes del sistema, busca MercaTax IVU PR y permite Notificaciones. La app continúa funcionando sin este permiso.</p>'
                : '<p>Las notificaciones locales no están disponibles en este dispositivo. La app continúa funcionando normalmente.</p>';
              const titleNode = document.getElementById('modalTitle');
              const bodyNode = document.getElementById('modalBody');
              const actionsNode = document.getElementById('modalActions');
              const modal = document.getElementById('modal');
              if (titleNode) titleNode.textContent = title;
              if (bodyNode) bodyNode.innerHTML = body;
              if (actionsNode) actionsNode.innerHTML = '<button class="btn warn" onclick="closeDialog()">Entendido</button>';
              if (modal) modal.style.display = 'flex';
            };
            window.sendLocalReminder = async (days) => {
              const key = 'mt_notice_' + new Date().toISOString().slice(0, 10);
              if (localStorage.getItem(key)) return;
              const result = await bridge.notifications.schedule({
                id: Number(new Date().toISOString().slice(0, 10).replace(/-/g, '').slice(-8)),
                title: 'MercaTax IVU PR',
                body: `Recordatorio: faltan ${days} días para rendir/pagar IVU.`,
                at: Date.now() + 1000
              });
              if (result.ok) localStorage.setItem(key, '1');
            };
            window.checkIvuReminder = async () => {
              if (typeof window.updateNotificationButton === 'function') window.updateNotificationButton();
              const day = new Date().getDate();
              let days = 20 - day;
              if (days < 0) days = 20;
              if ((day >= 15 || day === 1) && notificationPermission === 'granted') {
                setTimeout(() => window.sendLocalReminder(days), 800);
              }
            };
            window.openWhatsAppMessage = async (message) => {
              const number = typeof WA !== 'undefined' ? WA : '17873566336';
              const url = `https://wa.me/${number}?text=${encodeURIComponent(message)}`;
              try {
                await bridge.links.openExternal(url);
              } catch (_) {
                try { await navigator.clipboard?.writeText(message); } catch (_) {}
                if (typeof window.toast === 'function') window.toast('No se pudo abrir WhatsApp. El mensaje quedó disponible para copiar.');
              }
            };
            window.openExternal = (url) => {
              bridge.links.openExternal(url).catch(() => {});
              return true;
            };
            window.shareReport = async () => {
              if (typeof allMonthSales !== 'function' || typeof reportText !== 'function') return;
              const sales = allMonthSales();
              if (!sales.length) return typeof window.toast === 'function' && window.toast('Registre ventas para generar reporte');
              try { await bridge.share.text('Reporte MercaTax IVU PR', reportText(sales)); }
              catch (error) { if (error?.message && !/cancel/i.test(error.message) && typeof window.toast === 'function') window.toast('No se pudo compartir automáticamente.'); }
            };
            window.exportBackup = async () => {
              try {
                const payload = MercaTaxDomain.createBackupPayload(state);
                const fileName = 'mercatax-ivu-backup-v1-' + new Date().toISOString().slice(0, 10) + '.json';
                const file = await bridge.files.writeJson(fileName, payload);
                try { await bridge.share.file('Backup MercaTax IVU PR', file.uri); } catch (_) {}
                if (typeof window.toast === 'function') window.toast('Backup v1 creado en el dispositivo');
              } catch (_) {
                if (typeof window.toast === 'function') window.toast('No se pudo crear el backup');
              }
            };
            window.downloadReportHtml = async () => {
              const sales = typeof allMonthSales === 'function' ? allMonthSales() : [];
              if (!sales.length) return typeof window.toast === 'function' && window.toast('Registre ventas para generar reporte');
              try {
                const fileName = typeof reportFileName === 'function' ? reportFileName('html') : 'mercatax-ivu-reporte.html';
                const file = await bridge.files.writeText(fileName, window.reportHtml(sales));
                try { await bridge.share.file('Reporte MercaTax IVU PR', file.uri); } catch (_) {}
                if (typeof window.toast === 'function') window.toast('Reporte guardado en el dispositivo');
              } catch (_) {
                if (typeof window.toast === 'function') window.toast('No se pudo guardar el reporte');
              }
            };

            const updateConnectivity = ({ connected }) => {
              document.documentElement.classList.toggle('is-offline', !connected);
              window.dispatchEvent(new CustomEvent('mercatax:network-change', { detail: { connected } }));
            };
            try { updateConnectivity(await bridge.network.status()); } catch (_) {}
            bridge.network.onChange(updateConnectivity);
            bridge.lifecycle.onChange((detail) => window.dispatchEvent(new CustomEvent('mercatax:app-state', { detail })));

            if (typeof window.updateNotificationButton === 'function') window.updateNotificationButton();
            try { await SplashScreen.hide(); } catch (_) {}
            window.dispatchEvent(new CustomEvent('mercatax:native-ready', { detail: { platform: bridge.platform } }));
          }

          window.addEventListener('load', () => {
            installNativeOverrides().catch(() => {});
          }, { once: true });
          EOF

          cat > scripts/build-mobile.mjs <<'EOF'
          import { cpSync, existsSync, mkdirSync, readFileSync, rmSync, writeFileSync } from 'node:fs';
          import { build } from 'esbuild';

          const out = 'www';
          rmSync(out, { recursive: true, force: true });
          mkdirSync(out, { recursive: true });

          const files = [
            'index.html', 'script.js', 'style.css', 'mobile-r1.css', 'manifest.json', 'privacy.html',
            'icon-192.png', 'icon-512.png', 'apple-touch-icon.png', 'logo.png'
          ];
          for (const file of files) {
            if (existsSync(file)) cpSync(file, `${out}/${file}`);
          }
          for (const dir of ['assets', 'src']) {
            if (existsSync(dir)) cpSync(dir, `${out}/${dir}`, { recursive: true });
          }

          await build({
            entryPoints: ['src/mobile-native-entry.js'],
            bundle: true,
            platform: 'browser',
            format: 'iife',
            target: ['safari15', 'chrome100'],
            outfile: `${out}/mobile-native.js`,
            sourcemap: false,
            minify: false
          });

          const indexPath = `${out}/index.html`;
          let html = readFileSync(indexPath, 'utf8');
          if (!html.includes('mobile-native.js')) {
            const tag = '<script src="mobile-native.js" defer></script>';
            html = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, `${tag}</body>`) : `${html}\n${tag}\n`;
            writeFileSync(indexPath, html);
          }
          console.log('Mobile web bundle ready in www/ with local assets and native bridge.');
          EOF

          cat > scripts/mobile-foundation-gate.mjs <<'EOF'
          import { existsSync, readFileSync } from 'node:fs';

          function pass(condition, message) {
            if (!condition) throw new Error(message);
          }
          const config = JSON.parse(readFileSync('capacitor.config.json', 'utf8'));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const bridge = readFileSync('src/mobile-native-entry.js', 'utf8');
          const androidGradle = readFileSync('android/app/build.gradle', 'utf8');
          const iosProject = readFileSync('ios/App/App.xcodeproj/project.pbxproj', 'utf8');

          pass(config.appId === 'com.mercatax.ivupr', 'Capacitor appId mismatch');
          pass(config.appName === 'MercaTax IVU PR', 'Capacitor appName mismatch');
          pass(config.webDir === 'www', 'Capacitor webDir must be local www');
          pass(!config.server?.url, 'Remote server.url is prohibited');
          pass(existsSync('android/app/src/main/AndroidManifest.xml'), 'Android project missing');
          pass(existsSync('ios/App/App/Info.plist'), 'iOS project missing');
          pass(/applicationId\s+[= ]\s*["']com\.mercatax\.ivupr["']/.test(androidGradle), 'Android applicationId mismatch');
          pass(/versionCode\s+[= ]\s*1\b/.test(androidGradle), 'Android versionCode must be 1');
          pass(/versionName\s+[= ]\s*["']1\.0\.0["']/.test(androidGradle), 'Android versionName must be 1.0.0');
          pass(/PRODUCT_BUNDLE_IDENTIFIER = com\.mercatax\.ivupr;/.test(iosProject), 'iOS bundle identifier mismatch');
          pass(/MARKETING_VERSION = 1\.0\.0;/.test(iosProject), 'iOS marketing version must be 1.0.0');
          pass(/CURRENT_PROJECT_VERSION = 1;/.test(iosProject), 'iOS build number must be 1');

          for (const name of ['@capacitor/core','@capacitor/android','@capacitor/ios','@capacitor/app','@capacitor/browser','@capacitor/filesystem','@capacitor/local-notifications','@capacitor/network','@capacitor/preferences','@capacitor/share','@capacitor/splash-screen']) {
            pass(pkg.dependencies?.[name] || pkg.devDependencies?.[name], `Missing ${name}`);
          }
          for (const forbidden of ['firebase','@supabase/supabase-js','@capacitor/push-notifications']) {
            pass(!pkg.dependencies?.[forbidden] && !pkg.devDependencies?.[forbidden], `Forbidden dependency present: ${forbidden}`);
          }
          for (const marker of ['indexedDB.open', 'LocalNotifications.requestPermissions', 'permission-denied', 'Filesystem.writeFile', 'Filesystem.readFile', 'Share.share', 'Browser.open', "App.addListener('appStateChange'", "Network.addListener('networkStatusChange'", 'openWhatsAppMessage', 'downloadReportHtml']) {
            pass(bridge.includes(marker), `Bridge capability missing: ${marker}`);
          }
          pass(existsSync('android/app/src/main/res/mipmap-hdpi'), 'Android native icon assets missing');
          pass(existsSync('ios/App/App/Assets.xcassets/AppIcon.appiconset'), 'iOS native icon assets missing');
          console.log('Mobile R1-B foundation gate PASS');
          EOF

          cat > test/mobile-foundation.test.js <<'EOF'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import test from 'node:test';

          test('Capacitor config uses local web assets and the approved app id', () => {
            const config = JSON.parse(readFileSync('capacitor.config.json', 'utf8'));
            assert.equal(config.appId, 'com.mercatax.ivupr');
            assert.equal(config.webDir, 'www');
            assert.equal(config.server?.url, undefined);
          });

          test('native bridge handles denied notifications without forcing permission', () => {
            const source = readFileSync('src/mobile-native-entry.js', 'utf8');
            assert.match(source, /permission-denied/);
            assert.match(source, /LocalNotifications\.checkPermissions/);
            assert.match(source, /LocalNotifications\.requestPermissions/);
          });

          test('native bridge includes local structured data, files, share, lifecycle and offline hooks', () => {
            const source = readFileSync('src/mobile-native-entry.js', 'utf8');
            for (const token of ['indexedDB.open', 'Filesystem.writeFile', 'Filesystem.readFile', 'Share.share', "App.addListener('appStateChange'", "Network.addListener('networkStatusChange'"]) {
              assert.ok(source.includes(token), token);
            }
          });
          EOF

          cat > MOBILE_R1.md <<'EOF'
          # MercaTax IVU PR — R1-B Capacitor foundation

          Base: `store/mobile-r1` at `4fdba3456625afcac16f32a9cfd3cc9afd65f3af`.

          Native identity:
          - iOS bundle ID: `com.mercatax.ivupr`
          - Android application ID: `com.mercatax.ivupr`
          - Version: `1.0.0`
          - iOS build: `1`
          - Android versionCode: `1`

          The app loads the generated local `www/` bundle through Capacitor. `capacitor.config.json` intentionally has no `server.url`.

          Native foundation included in R1-B:
          - local structured IndexedDB bridge for future native-safe structured records without replacing the existing R1 storage contract;
          - Preferences only for small settings;
          - Local Notifications with explicit denied-permission handling;
          - Filesystem export/read helpers;
          - native Share sheet;
          - external HTTPS links through Capacitor Browser;
          - app foreground/background lifecycle events;
          - Network status and offline events;
          - generated Android/iOS icons and splash resources from the approved `assets/icon-source.svg`.

          No Firebase, cloud sync, authentication, Gemini, remote push, payments, subscriptions, deep links, universal links, biometrics, backend, API work, tax-logic changes, or secure-storage database migration are part of R1-B.

          ## Reproduce locally

          ```bash
          npm ci
          npm run mobile:build
          npx cap sync
          npx cap open ios
          npx cap open android
          ```

          Validation:

          ```bash
          npm run gate
          npm run mobile:gate
          cd android && ./gradlew assembleDebug
          # macOS/Xcode: build the App scheme for an iOS Simulator with code signing disabled.
          ```
          EOF

          node <<'EOF'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.scripts['mobile:build'] = 'npm run build && node scripts/build-mobile.mjs';
          p.scripts['mobile:sync'] = 'npm run mobile:build && cap sync';
          p.scripts['mobile:open:ios'] = 'npm run mobile:sync && cap open ios';
          p.scripts['mobile:open:android'] = 'npm run mobile:sync && cap open android';
          p.scripts['mobile:gate'] = 'node scripts/mobile-foundation-gate.mjs';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          EOF

          cat > .gitignore <<'EOF'
          node_modules/
          www/
          .DS_Store
          android/.gradle/
          android/local.properties
          ios/App/DerivedData/
          EOF

      - name: Install Capacitor 8 and approved native plugins
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact \
            @capacitor/core@8.4.2 \
            @capacitor/android@8.4.2 \
            @capacitor/ios@8.4.2 \
            @capacitor/app@8 \
            @capacitor/browser@8 \
            @capacitor/filesystem@8 \
            @capacitor/local-notifications@8 \
            @capacitor/network@8 \
            @capacitor/preferences@8 \
            @capacitor/share@8 \
            @capacitor/splash-screen@8
          npm install --save-dev --save-exact @capacitor/cli@8.4.2 @capacitor/assets@3.0.5 esbuild

      - name: Build local web bundle and generate native projects
        shell: bash
        run: |
          set -euo pipefail
          npm run mobile:build
          rm -rf ios android
          npx cap add ios
          npx cap add android
          cp assets/icon-source.svg assets/logo.svg
          npx @capacitor/assets generate --ios --android \
            --iconBackgroundColor '#111418' \
            --iconBackgroundColorDark '#111418' \
            --splashBackgroundColor '#111418' \
            --splashBackgroundColorDark '#111418'
          rm assets/logo.svg

      - name: Apply approved versions
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('fs');
          const androidPath = 'android/app/build.gradle';
          let android = fs.readFileSync(androidPath, 'utf8');
          android = android.replace(/versionCode\s*(?:=\s*)?\d+/, 'versionCode 1');
          android = android.replace(/versionName\s*(?:=\s*)?["'][^"']+["']/, 'versionName "1.0.0"');
          fs.writeFileSync(androidPath, android);

          const iosPath = 'ios/App/App.xcodeproj/project.pbxproj';
          let ios = fs.readFileSync(iosPath, 'utf8');
          ios = ios.replace(/MARKETING_VERSION = [^;]+;/g, 'MARKETING_VERSION = 1.0.0;');
          ios = ios.replace(/CURRENT_PROJECT_VERSION = [^;]+;/g, 'CURRENT_PROJECT_VERSION = 1;');
          fs.writeFileSync(iosPath, ios);
          EOF
          npm run mobile:build
          npx cap sync

      - name: Run web/domain and mobile foundation gates
        shell: bash
        run: |
          set -euo pipefail
          npm run gate
          npm run mobile:gate
          npx cap doctor

      - name: Build Android debug
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mercatax-derived
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath /tmp/mercatax-derived CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath /tmp/mercatax-derived CODE_SIGNING_ALLOWED=NO build
          fi
          test -d /tmp/mercatax-derived/Build/Products/Debug-iphonesimulator/App.app

      - name: Clean-launch iOS simulator smoke gate
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -Eo '[0-9A-F-]{36}' || true)"
          test -n "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" /tmp/mercatax-derived/Build/Products/Debug-iphonesimulator/App.app
          LAUNCH_OUTPUT="$(xcrun simctl launch "$UDID" com.mercatax.ivupr)"
          echo "$LAUNCH_OUTPUT"
          echo "$LAUNCH_OUTPUT" | grep -q 'com.mercatax.ivupr:'
          xcrun simctl terminate "$UDID" com.mercatax.ivupr || true
          xcrun simctl shutdown "$UDID" || true
          echo "Clean launch gate PASS"

      - name: Verify no prohibited remote/mobile services
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'firebase|supabase|gemini|push-notifications|server[[:space:]]*:[[:space:]]*\{[^}]*url' \
            capacitor.config.json package.json src/mobile-native-entry.js ios android \
            --exclude-dir=build --exclude-dir=.gradle --exclude='*.lock' || {
              echo 'Forbidden R1-B service/config marker found'
              exit 1
            }
          npm run secret-scan

      - name: Commit validated R1-B artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore MOBILE_R1.md capacitor.config.json package.json package-lock.json \
            src/mobile-native-entry.js scripts/build-mobile.mjs scripts/mobile-foundation-gate.mjs \
            test/mobile-foundation.test.js ios android .github/workflows/r1b-capacitor-bootstrap.yml
          git commit -m 'Build Capacitor R1-B mobile foundation'
          git push origin HEAD:mobi/capacitor-r1
          echo "FINAL_SHA=$(git rev-parse HEAD)"
