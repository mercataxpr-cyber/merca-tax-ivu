name: Final Mobile + TAX R1 Integration Gate

on:
  push:
    branches:
      - integration/mobile-tax-r1-final
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-mobile-tax-r1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-integrated-candidate:
    runs-on: macos-15
    timeout-minutes: 50

    steps:
      - name: Checkout exact integrated candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove integration ancestry and main isolation
        shell: bash
        run: |
          set -euo pipefail
          MOBI="419f2d7f3b60d2fde410be2e40b6a7d7b55a9383"
          TAX="23a016f08385439943728056319936bc581dece2"
          EXPECTED_MAIN="26bbdc4529ad7d814305ef0e22499e4ab5be75ca"
          test "$GITHUB_REF_NAME" = "integration/mobile-tax-r1-final"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$MOBI" HEAD
          git merge-base --is-ancestor "$TAX" HEAD
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          echo "INTEGRATED_SHA=$(git rev-parse HEAD)"
          echo "MOBI_ANCESTOR=$MOBI"
          echo "TAX_ANCESTOR=$TAX"
          echo "MAIN_ISOLATION=PASS"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci

      - name: Run full web and domain gate
        run: npm run gate

      - name: Run focused TAX regression gate
        run: npm run test:tax

      - name: Run mobile foundation and backup gates
        shell: bash
        run: |
          set -euo pipefail
          npm run mobile:gate
          npm run test:backup

      - name: Build and sync local native bundle
        shell: bash
        run: |
          set -euo pipefail
          npm run mobile:build
          npx cap sync
          test -f ios/App/App/public/index.html
          test -f android/app/src/main/assets/public/index.html
          grep -q "src/tax-remediation.js" script.js
          grep -q "src/tax-calendar-contract.js" script.js
          grep -q "src/tax-ui-bridge.js" script.js

      - name: Build Android debug and unsigned release AAB
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          echo "ANDROID_DEBUG_APK=PASS"
          echo "ANDROID_UNSIGNED_RELEASE_AAB=PASS"

      - name: Build iOS Debug simulator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mercatax-derived-debug
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath /tmp/mercatax-derived-debug CODE_SIGNING_ALLOWED=NO build
          test -d /tmp/mercatax-derived-debug/Build/Products/Debug-iphonesimulator/App.app
          echo "IOS_DEBUG_SIMULATOR=PASS"

      - name: Build iOS Release simulator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mercatax-derived-release
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Release -derivedDataPath /tmp/mercatax-derived-release CODE_SIGNING_ALLOWED=NO build
          test -d /tmp/mercatax-derived-release/Build/Products/Release-iphonesimulator/App.app
          echo "IOS_RELEASE_SIMULATOR=PASS"

      - name: Clean-launch integrated iOS candidate
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -Eo '[0-9A-F-]{36}' || true)"
          test -n "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" /tmp/mercatax-derived-release/Build/Products/Release-iphonesimulator/App.app
          FIRST="$(xcrun simctl launch "$UDID" com.mercatax.ivupr)"
          echo "$FIRST" | grep -q 'com.mercatax.ivupr:'
          xcrun simctl terminate "$UDID" com.mercatax.ivupr
          SECOND="$(xcrun simctl launch "$UDID" com.mercatax.ivupr)"
          echo "$SECOND" | grep -q 'com.mercatax.ivupr:'
          xcrun simctl terminate "$UDID" com.mercatax.ivupr || true
          xcrun simctl shutdown "$UDID" || true
          echo "IOS_RELEASE_CLEAN_LAUNCH=PASS"

      - name: Verify no tracked generated-file drift
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "FINAL_INTEGRATION_WORKTREE_CLEAN=PASS"

      - name: Upload Android validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mercatax-final-r1-android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
