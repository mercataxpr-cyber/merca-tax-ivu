name: KORA R2 Node Check

on:
  push:
    branches:
      - release/store-ready-r2-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Secret scan
        run: npm run secret-scan
      - name: TAX
        run: npm run test:tax
      - name: Mobile TAX test
        run: npm run test:mobile-tax-parity
      - name: Backup
        run: npm run test:backup
