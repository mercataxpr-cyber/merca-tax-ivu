name: R1-B Capacitor Build Gate

on:
  push:
    branches:
      - mobi/capacitor-r1
    paths:
      - .github/workflows/r1b-capacitor-build.yml

permissions:
  contents: write

jobs:
  build-validate-commit:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout authorized branch
        uses: actions/checkout@v4
        with:
          ref: mobi/capacitor-r1
          fetch-depth: 0

      - name: Verify frozen ancestry and main isolation
        shell: bash
        run: |
          set -euo pipefail
          BASE="4fdba3456625afcac16f32a9cfd3cc9afd65f3af"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse origin/main)" = "26bbdc4529ad7d814305ef0e22499e4ab5be75ca"
          echo "R1-B BASE/MAIN gate PASS"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor and approved native plugins
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact \
            @capacitor/core@8.4.2 \
            @capacitor/android@8.4.2 \
            @capacitor/ios@8.4.2 \
            @capacitor/app@8 \
            @capacitor/browser@8 \
            @capacitor/filesystem@8 \
            @capacitor/local-notifications@8 \
            @capacitor/network@8 \
            @capacitor/preferences@8 \
            @capacitor/share@8 \
            @capacitor/splash-screen@8
          npm install --save-dev --save-exact \
            @capacitor/cli@8.4.2 \
            @capacitor/assets@3.0.5 \
            esbuild
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.scripts['mobile:build'] = 'npm run build && node scripts/build-mobile.mjs';
          p.scripts['mobile:sync'] = 'npm run mobile:build && cap sync';
          p.scripts['mobile:open:ios'] = 'npm run mobile:sync && cap open ios';
          p.scripts['mobile:open:android'] = 'npm run mobile:sync && cap open android';
          p.scripts['mobile:gate'] = 'node scripts/mobile-foundation-gate.mjs';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE

      - name: Generate local web bundle and native projects
        shell: bash
        run: |
          set -euo pipefail
          npm run mobile:build
          rm -rf ios android
          npx cap add ios
          npx cap add android
          cp assets/icon-source.svg assets/logo.svg
          npx @capacitor/assets generate --ios --android \
            --iconBackgroundColor '#111418' \
            --iconBackgroundColorDark '#111418' \
            --splashBackgroundColor '#111418' \
            --splashBackgroundColorDark '#111418'
          rm assets/logo.svg

      - name: Apply approved versions and sync
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const androidPath = 'android/app/build.gradle';
          let android = fs.readFileSync(androidPath, 'utf8');
          android = android.replace(/versionCode\s*(?:=\s*)?\d+/, 'versionCode 1');
          android = android.replace(/versionName\s*(?:=\s*)?["'][^"']+["']/, 'versionName "1.0.0"');
          fs.writeFileSync(androidPath, android);

          const iosPath = 'ios/App/App.xcodeproj/project.pbxproj';
          let ios = fs.readFileSync(iosPath, 'utf8');
          ios = ios.replace(/MARKETING_VERSION = [^;]+;/g, 'MARKETING_VERSION = 1.0.0;');
          ios = ios.replace(/CURRENT_PROJECT_VERSION = [^;]+;/g, 'CURRENT_PROJECT_VERSION = 1;');
          fs.writeFileSync(iosPath, ios);
          NODE
          npm run mobile:build
          npx cap sync
          test -f ios/App/App/public/index.html
          test -f android/app/src/main/assets/public/index.html
          echo "LOCAL ASSETS/OFFLINE packaging gate PASS"

      - name: Run domain, web, permission and mobile gates
        shell: bash
        run: |
          set -euo pipefail
          npm run gate
          npm run mobile:gate
          npm run test:backup
          ! grep -RniE 'firebase|supabase|gemini|@capacitor/push-notifications' \
            capacitor.config.json package.json src/mobile-native-entry.js ios android \
            --exclude-dir=build --exclude-dir=.gradle --exclude='*.lock'
          npm run secret-scan
          echo "R1-B WEB/DOMAIN/PERMISSION/NO-SECRETS gates PASS"

      - name: Build Android debug
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "ANDROID BUILD gate PASS"

      - name: Build iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mercatax-derived
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath /tmp/mercatax-derived CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath /tmp/mercatax-derived CODE_SIGNING_ALLOWED=NO build
          fi
          test -d /tmp/mercatax-derived/Build/Products/Debug-iphonesimulator/App.app
          echo "IOS BUILD gate PASS"

      - name: Clean-launch and lifecycle iOS simulator smoke gate
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -Eo '[0-9A-F-]{36}' || true)"
          test -n "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" /tmp/mercatax-derived/Build/Products/Debug-iphonesimulator/App.app
          FIRST="$(xcrun simctl launch "$UDID" com.mercatax.ivupr)"
          echo "$FIRST" | grep -q 'com.mercatax.ivupr:'
          xcrun simctl terminate "$UDID" com.mercatax.ivupr
          SECOND="$(xcrun simctl launch "$UDID" com.mercatax.ivupr)"
          echo "$SECOND" | grep -q 'com.mercatax.ivupr:'
          xcrun simctl terminate "$UDID" com.mercatax.ivupr || true
          xcrun simctl shutdown "$UDID" || true
          echo "IOS CLEAN-LAUNCH/LIFECYCLE gate PASS"

      - name: Commit validated native projects
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json ios android
          echo 'Tracked native delta:'
          git status --short
          if git diff --cached --quiet; then
            echo 'No native project changes were staged'
            exit 1
          fi
          git commit -m 'Build validated Capacitor R1-B native projects'
          git push origin HEAD:mobi/capacitor-r1
          echo "FINAL_SHA=$(git rev-parse HEAD)"
