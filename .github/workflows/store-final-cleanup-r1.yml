name: Store Dependency Lock Regeneration R1

on:
  push:
    branches:
      - ops/store-final-cleanup-r1
    paths:
      - .github/workflows/store-final-cleanup-r1.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated ops branch
        uses: actions/checkout@v4
        with:
          ref: ops/store-final-cleanup-r1
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Remove unused vulnerable asset tool and regenerate lock
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.devDependencies?.['@capacitor/assets'] !== '3.0.5') {
            throw new Error('Unexpected @capacitor/assets state');
          }
          delete p.devDependencies['@capacitor/assets'];
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          ! grep -q '"@capacitor/assets"' package.json
          ! grep -q 'node_modules/@capacitor/assets' package-lock.json

      - name: Prove lock is installable and critical audit is clear
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=critical
          npm audit --omit=dev --audit-level=high

      - name: Commit regenerated dependency lock to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          git diff --cached --check
          git commit -m 'ops: regenerate dependency lock without capacitor assets'
          git push origin HEAD:ops/store-final-cleanup-r1
