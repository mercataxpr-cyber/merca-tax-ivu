name: Store Final Cleanup R1

on:
  push:
    branches:
      - ops/store-final-cleanup-r1
    paths:
      - .github/workflows/store-final-cleanup-r1.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: release/store-ready-r1-candidate
          fetch-depth: 0

      - name: Prove frozen starting SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "92404bee8905bc25573f2c67eaf8ade041d5d49b"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply bounded cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}')
              p.write_text(text.replace(old, new, 1))

          package = Path('package.json')
          data = json.loads(package.read_text())
          removed = data.get('devDependencies', {}).pop('@capacitor/assets', None)
          if removed != '3.0.5':
              raise SystemExit(f'unexpected @capacitor/assets value: {removed!r}')
          package.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          ignore = Path('.gitignore')
          ignore_text = ignore.read_text()
          if 'public/\n' not in ignore_text:
              if 'www/\n' not in ignore_text:
                  raise SystemExit('expected www/ ignore anchor not found')
              ignore.write_text(ignore_text.replace('www/\n', 'www/\npublic/\n', 1))

          replace_once(
              'src/tax-remediation.js',
              """  const ROUNDING_POLICY = Object.freeze({\n    status: 'POLICY/TAX SME REQUIRED',\n    included: 'HISTORICAL_COMPATIBILITY_SEQUENCE',\n    added: 'TECHNICAL_RECONCILIATION_PENDING_TAX_SME',\n  });""",
              """  const ROUNDING_POLICY = Object.freeze({\n    status: 'ROUNDING_RULE_CERTIFIED',\n    method: 'HALF_CENT_UP',\n    source: 'PR_TREASURY_IVU_REGULATION_ART_4020_01_1_B_1',\n    scope: 'CURRENCY_ROUNDING_ONLY',\n    included: 'HISTORICAL_COMPATIBILITY_SEQUENCE',\n    added: 'REGULATORY_HALF_CENT_RULE',\n  });""",
          )
          replace_once(
              'src/tax-remediation.js',
              '   * This is a mathematical compatibility policy only; TAX SME must certify any legal rounding requirement.',
              '   * Currency rounding follows the certified half-cent rule. This inverse sequence is retained for compatibility and does not itself authorize tax-inclusive pricing, which is governed separately by Article 4020.06-1.',
          )
          replace_once(
              'src/tax-remediation.js',
              '   * This newly exposed operation requires independent TAX SME review before legal certification.',
              '   * Currency rounding follows Article 4020.01-1(b)(1) of the Puerto Rico Treasury IVU Regulation: half a cent or more rounds up; less than half a cent does not.',
          )

          replace_once(
              'test/tax-remediation.test.js',
              """test('rounding policy is isolated and explicitly pending TAX SME certification', () => {\n  assert.equal(domain.ROUNDING_POLICY.status, 'POLICY/TAX SME REQUIRED');\n  assert.equal(domain.ROUNDING_POLICY.included, 'HISTORICAL_COMPATIBILITY_SEQUENCE');\n  assert.equal(domain.ROUNDING_POLICY.added, 'TECHNICAL_RECONCILIATION_PENDING_TAX_SME');\n});""",
              """test('rounding rule is certified to Puerto Rico Treasury half-cent policy', () => {\n  assert.equal(domain.ROUNDING_POLICY.status, 'ROUNDING_RULE_CERTIFIED');\n  assert.equal(domain.ROUNDING_POLICY.method, 'HALF_CENT_UP');\n  assert.equal(domain.ROUNDING_POLICY.source, 'PR_TREASURY_IVU_REGULATION_ART_4020_01_1_B_1');\n  assert.equal(domain.ROUNDING_POLICY.scope, 'CURRENCY_ROUNDING_ONLY');\n  assert.equal(domain.ROUNDING_POLICY.included, 'HISTORICAL_COMPATIBILITY_SEQUENCE');\n  assert.equal(domain.ROUNDING_POLICY.added, 'REGULATORY_HALF_CENT_RULE');\n});\n\ntest('11.5% added IVU follows the official half-cent boundary', () => {\n  assert.equal(domain.calculateTaxAdded(0.04, 'GENERAL_11_5').ivu, 0);\n  assert.equal(domain.calculateTaxAdded(0.05, 'GENERAL_11_5').ivu, 0.01);\n});""",
          )

          replace_once(
              '.github/workflows/final-mobile-tax-r1-gate.yml',
              "          grep -Eq '^targetSdkVersion = 36$' android/variables.gradle",
              "          grep -Eq '^[[:space:]]*targetSdkVersion[[:space:]]*=[[:space:]]*36[[:space:]]*$' android/variables.gradle",
          )
          replace_once(
              '.github/workflows/final-mobile-tax-r1-gate.yml',
              '          test -z "$(git status --porcelain --untracked-files=no)"',
              '          test -z "$(git status --porcelain)"',
          )
          PY

      - name: Regenerate locked dependency tree
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          ! grep -q '"@capacitor/assets"' package.json
          ! grep -q 'node_modules/@capacitor/assets' package-lock.json

      - name: Validate cleanup before publish
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-fund
          npm run gate
          npm run test:tax
          npm run test:mobile-tax-parity
          npm audit --audit-level=critical
          npm audit --omit=dev --audit-level=high

      - name: Commit bounded cleanup to release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json src/tax-remediation.js test/tax-remediation.test.js .gitignore .github/workflows/final-mobile-tax-r1-gate.yml
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "6"
          git diff --cached --check
          git commit -m 'fix: close store certification blockers'
          git push origin HEAD:release/store-ready-r1-candidate
