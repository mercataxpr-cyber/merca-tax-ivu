name: PWA Shortcut Icon Hotfix

on:
  push:
    branches:
      - mobi/icon-zip-hotfix-r5
    paths:
      - .github/workflows/pwa-shortcut-icon-hotfix.yml

permissions:
  contents: write

jobs:
  fix-shortcut-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobi/icon-zip-hotfix-r5
          fetch-depth: 0

      - name: Replace stale browser favicon references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<link rel="manifest" href="manifest.json">', '<link rel="manifest" href="manifest.json?v=zip-r6-20260821">')
          s = re.sub(r'<link rel="apple-touch-icon" href="[^"]+">', '<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=zip-r6-20260821">', s, count=1)
          s = re.sub(r'<link rel="icon" href="data:image/[^\"]+">', '<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=zip-r6-20260821">\n<link rel="shortcut icon" href="icon-192.png?v=zip-r6-20260821">', s, count=1)
          p.write_text(s)

          m = Path('manifest.json')
          ms = m.read_text().replace('zip-r5-20260821', 'zip-r6-20260821')
          m.write_text(ms)
          PY

      - name: Commit browser icon hotfix only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pwa-shortcut-icon-hotfix.yml
          git config user.name 'MercaTax MOBI'
          git config user.email 'mercataxpr@gmail.com'
          git add index.html manifest.json .github/workflows/pwa-shortcut-icon-hotfix.yml
          git commit -m 'fix(pwa): use approved ZIP icon for browser shortcut'
          git push origin HEAD:mobi/icon-zip-hotfix-r5
