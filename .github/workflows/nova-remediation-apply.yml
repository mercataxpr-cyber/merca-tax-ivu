name: NOVA Remediation Apply

on:
  push:
    branches:
      - nova/ui-refinement-r1-final

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nova/ui-refinement-r1-final
          fetch-depth: 0
      - name: Mark runner execution
        run: |
          printf 'runner executed for %s\n' "$GITHUB_SHA" > .nova-workflow-ran
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nova-workflow-ran
          git commit -m "chore: confirm NOVA remediation runner"
          git push origin HEAD:nova/ui-refinement-r1-final
