name: R1-B Capacitor Bootstrap Retry

on:
  push:
    branches:
      - mobi/capacitor-r1
    paths:
      - .github/workflows/r1b-capacitor-retry.yml

permissions:
  contents: write

jobs:
  patch-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized branch
        uses: actions/checkout@v4
        with:
          ref: mobi/capacitor-r1
          fetch-depth: 0

      - name: Remove premature npm cache requirement and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/r1b-capacitor-bootstrap.yml')
          text = path.read_text()
          needle = "          cache: npm\n"
          if needle not in text:
              raise SystemExit('Expected cache line not found')
          path.write_text(text.replace(needle, '', 1))
          PY
          git rm .github/workflows/r1b-capacitor-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/r1b-capacitor-bootstrap.yml
          git commit -m 'Fix R1-B bootstrap npm cache precondition'
          git push origin HEAD:mobi/capacitor-r1
