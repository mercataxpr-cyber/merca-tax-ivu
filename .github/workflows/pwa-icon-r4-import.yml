name: PWA Approved Icon R4 Import

on:
  pull_request:
    branches: [release/store-ready-r1-candidate]
    paths:
      - '.github/workflows/pwa-icon-r4-import.yml'
      - 'manifest.json'
      - 'scripts/build-web.mjs'
      - 'scripts/build-mobile.mjs'
      - 'test/pwa-official-icon.test.js'
      - 'PWA_APPROVED_ICON_SOURCE.md'
      - 'PWA_ICON_FIX_EVIDENCE.md'
      - 'assets/**'

permissions:
  contents: write

jobs:
  import-approved-icon:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download exact user-approved AppIcons package
        shell: bash
        run: |
          set -euo pipefail
          FILE_ID='1RNCBaWGad_d9wJHT4Mk1q6IHskSXCdmA'
          EXPECTED_SIZE='5316497'
          EXPECTED_SHA='8dd8041143235b96a12f969d6a575623573688e45b0113e5a9b99b9fc5648773'

          python -m pip install --quiet gdown
          gdown --id "$FILE_ID" -O /tmp/AppIcons.zip || true

          if [ ! -f /tmp/AppIcons.zip ] || [ "$(stat -c%s /tmp/AppIcons.zip 2>/dev/null || echo 0)" != "$EXPECTED_SIZE" ]; then
            rm -f /tmp/AppIcons.zip
            curl -L --fail --retry 2 -c /tmp/gdrive.cookies \
              -o /tmp/AppIcons.first \
              "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
            if [ "$(stat -c%s /tmp/AppIcons.first)" = "$EXPECTED_SIZE" ]; then
              mv /tmp/AppIcons.first /tmp/AppIcons.zip
            else
              file /tmp/AppIcons.first || true
              echo "Downloaded bytes: $(stat -c%s /tmp/AppIcons.first)"
              echo 'Exact approved ZIP was not obtainable without changing sharing/access. Import aborted.'
              exit 1
            fi
          fi

          test "$(stat -c%s /tmp/AppIcons.zip)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA  /tmp/AppIcons.zip" | sha256sum -c -
          unzip -t /tmp/AppIcons.zip >/dev/null

      - name: Install only approved PWA icon assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/approved-pwa assets/pwa-approved-r4 assets/app-icon-approved-r4
          mkdir -p assets/app-icon-approved-r4
          unzip -p /tmp/AppIcons.zip 'android/mipmap-xxxhdpi/ic_launcher.png' > assets/app-icon-approved-r4/icon-192.png
          unzip -p /tmp/AppIcons.zip 'playstore.png' > assets/app-icon-approved-r4/icon-512.png
          unzip -p /tmp/AppIcons.zip 'Assets.xcassets/AppIcon.appiconset//180.png' > assets/app-icon-approved-r4/apple-touch-icon.png

          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          expected = {
              'assets/app-icon-approved-r4/icon-192.png': (192, 192),
              'assets/app-icon-approved-r4/icon-512.png': (512, 512),
              'assets/app-icon-approved-r4/apple-touch-icon.png': (180, 180),
          }
          for path, size in expected.items():
              with Image.open(path) as image:
                  if image.size != size:
                      raise SystemExit(f'{path}: expected {size}, got {image.size}')
          PY

      - name: Commit exact approved binaries to PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f TEMP_TEST_DO_NOT_KEEP.txt
          git config user.name 'MercaTax Icon Gate'
          git config user.email 'mercataxpr@gmail.com'
          git add -A assets/app-icon-approved-r4 assets/approved-pwa assets/pwa-approved-r4 TEMP_TEST_DO_NOT_KEEP.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Approved icon binaries already installed.'
            exit 0
          fi
          git commit -m 'assets(pwa): install exact user-approved AppIcons R4'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
