name: MercaTax Icon ZIP Hotfix R5

on:
  push:
    branches:
      - mobi/icon-zip-hotfix-r5
    paths:
      - .github/workflows/icon-zip-hotfix-r5.yml

permissions:
  contents: write

jobs:
  apply-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: mobi/icon-zip-hotfix-r5
          fetch-depth: 0

      - name: Fetch exact approved AppIcons package
        shell: bash
        run: |
          set -euo pipefail
          FILE_ID='1RNCBaWGad_d9wJHT4Mk1q6IHskSXCdmA'
          EXPECTED_SIZE='5316497'
          EXPECTED_SHA='8dd8041143235b96a12f969d6a575623573688e45b0113e5a9b99b9fc5648773'
          python -m pip install --quiet gdown pillow
          gdown --id "$FILE_ID" -O /tmp/AppIcons.zip || true
          if [ ! -f /tmp/AppIcons.zip ] || [ "$(stat -c%s /tmp/AppIcons.zip 2>/dev/null || echo 0)" != "$EXPECTED_SIZE" ]; then
            rm -f /tmp/AppIcons.zip
            curl -L --fail --retry 3 -o /tmp/AppIcons.zip "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
          fi
          test "$(stat -c%s /tmp/AppIcons.zip)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA  /tmp/AppIcons.zip" | sha256sum -c -

      - name: Replace PWA and native icon assets only
        shell: bash
        run: |
          set -euo pipefail
          unzip -p /tmp/AppIcons.zip 'android/mipmap-xxxhdpi/ic_launcher.png' > icon-192.png
          unzip -p /tmp/AppIcons.zip 'playstore.png' > icon-512.png
          unzip -p /tmp/AppIcons.zip 'Assets.xcassets/AppIcon.appiconset/180.png' > apple-touch-icon.png

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            unzip -p /tmp/AppIcons.zip "android/mipmap-${density}/ic_launcher.png" > "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-${density}/ic_launcher.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

          unzip -p /tmp/AppIcons.zip 'android/adaptive-foreground.png' > /tmp/adaptive-foreground.png
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Image.open('/tmp/adaptive-foreground.png').convert('RGBA')
          sizes = {'ldpi':81,'mdpi':108,'hdpi':162,'xhdpi':216,'xxhdpi':324,'xxxhdpi':432}
          resampling = getattr(Image, 'Resampling', Image).LANCZOS
          for density, px in sizes.items():
              folder = Path(f'android/app/src/main/res/mipmap-{density}')
              folder.mkdir(parents=True, exist_ok=True)
              src.resize((px, px), resampling).save(folder / 'ic_launcher_foreground.png')
              Image.new('RGBA', (px, px), (255,255,255,255)).save(folder / 'ic_launcher_background.png')
          PY

          unzip -p /tmp/AppIcons.zip 'Assets.xcassets/AppIcon.appiconset/1024.png' > ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png

          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('manifest.json')
          data = json.loads(path.read_text())
          data['icons'] = [
              {'src':'icon-192.png?v=zip-r5-20260821','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'icon-512.png?v=zip-r5-20260821','sizes':'512x512','type':'image/png','purpose':'any'}
          ]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit icon-only hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/icon-zip-hotfix-r5.yml
          git config user.name 'MercaTax MOBI'
          git config user.email 'mercataxpr@gmail.com'
          git add icon-192.png icon-512.png apple-touch-icon.png manifest.json \
            android/app/src/main/res/mipmap-* \
            ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png \
            .github/workflows/icon-zip-hotfix-r5.yml
          git commit -m 'fix(icon): replace app and PWA icons with approved ZIP artwork'
          git push origin HEAD:mobi/icon-zip-hotfix-r5
