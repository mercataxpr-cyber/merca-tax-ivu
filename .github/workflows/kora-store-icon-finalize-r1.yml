name: KORA Store Icon Finalize R1

on:
  pull_request:
    branches:
      - release/store-ready-r1-candidate
    paths:
      - .github/workflows/kora-store-icon-finalize-r1.yml

permissions:
  contents: write

jobs:
  finalize-exact-approved-identity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      APPROVED_ZIP_SHA256: 8dd8041143235b96a12f969d6a575623573688e45b0113e5a9b99b9fc5648773
      EXPECTED_ANDROID_192_GIT_BLOB: 7fbaccec4055a9f314e55e9c91c2f19af9578a1c
      EXPECTED_IOS_1024_GIT_BLOB: 408584781de00f1ce6d8fff7729b7ef3b7a1fedf
      EXPECTED_ANDROID_192_SHA256: e083d140f053cd45c9de98a24dd4ec8a120a490da51cf5cbae93242dc70b50c6
      EXPECTED_IOS_1024_SHA256: 8fb78e44c886e86036d050bfde9ec0cfbcfc23ecfe61c347f42488ab537b3418
    steps:
      - name: Checkout isolated KORA branch
        uses: actions/checkout@v5
        with:
          ref: kora/store-icon-identity-final-r1
          fetch-depth: 0

      - name: Reconstruct authenticated approved icon sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kora-approved && mkdir -p /tmp/kora-approved

          cat .github/kora-payload/android192/*.b64 | tr -d '\r\n' | base64 --decode > /tmp/kora-approved/android-192.png
          cat .github/kora-payload/ios1024/*.b64 | tr -d '\r\n' | base64 --decode > /tmp/kora-approved/ios-1024.png

          test "$(git hash-object /tmp/kora-approved/android-192.png)" = "$EXPECTED_ANDROID_192_GIT_BLOB"
          test "$(git hash-object /tmp/kora-approved/ios-1024.png)" = "$EXPECTED_IOS_1024_GIT_BLOB"
          echo "$EXPECTED_ANDROID_192_SHA256  /tmp/kora-approved/android-192.png" | sha256sum -c -
          echo "$EXPECTED_IOS_1024_SHA256  /tmp/kora-approved/ios-1024.png" | sha256sum -c -

          python - <<'PY'
          from pathlib import Path
          for path, expected in [
              (Path('/tmp/kora-approved/android-192.png'), (192, 192)),
              (Path('/tmp/kora-approved/ios-1024.png'), (1024, 1024)),
          ]:
              b = path.read_bytes()
              if b[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'Not PNG: {path}')
              size = (int.from_bytes(b[16:20], 'big'), int.from_bytes(b[20:24], 'big'))
              if size != expected:
                  raise SystemExit(f'Unexpected size for {path}: {size}')
          PY

          echo "KORA_APPROVED_ZIP_PROVENANCE_SHA256=$APPROVED_ZIP_SHA256"
          echo 'KORA_AUTHENTICATED_ICON_SOURCES=PASS'

      - name: Install official PWA Android and iOS identity
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'Pillow==11.3.0'

          cp /tmp/kora-approved/android-192.png icon-192.png
          cp /tmp/kora-approved/ios-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png

          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          ios = Image.open('/tmp/kora-approved/ios-1024.png').convert('RGBA')
          android = Image.open('/tmp/kora-approved/android-192.png').convert('RGBA')

          ios.resize((512, 512), Image.Resampling.LANCZOS).save('icon-512.png', format='PNG', optimize=False, compress_level=9)
          ios.resize((180, 180), Image.Resampling.LANCZOS).save('apple-touch-icon.png', format='PNG', optimize=False, compress_level=9)

          launcher_sizes = {'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192}
          foreground_sizes = {'mdpi':108, 'hdpi':162, 'xhdpi':216, 'xxhdpi':324, 'xxxhdpi':432}

          # Use the exact approved Android 192 artwork as the launcher source.
          for density, size in launcher_sizes.items():
              out = android if size == 192 else android.resize((size, size), Image.Resampling.LANCZOS)
              dst = Path(f'android/app/src/main/res/mipmap-{density}')
              dst.mkdir(parents=True, exist_ok=True)
              out.save(dst / 'ic_launcher.png', format='PNG', optimize=False, compress_level=9)
              out.save(dst / 'ic_launcher_round.png', format='PNG', optimize=False, compress_level=9)
              bg = dst / 'ic_launcher_background.png'
              if bg.exists(): bg.unlink()

          # Adaptive foreground is a technical derivative of the exact approved 1024 artwork.
          # Keep the complete mark inside Android's adaptive safe zone so masks do not crop it.
          safe = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          mark = ios.resize((680, 680), Image.Resampling.LANCZOS)
          safe.alpha_composite(mark, ((1024 - 680)//2, (1024 - 680)//2))
          for density, size in foreground_sizes.items():
              dst = Path(f'android/app/src/main/res/mipmap-{density}/ic_launcher_foreground.png')
              safe.resize((size, size), Image.Resampling.LANCZOS).save(dst, format='PNG', optimize=False, compress_level=9)
          PY

          cat > android/app/src/main/res/values/store_icon_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="store_icon_background">#FFFFFF</color>
          </resources>
          XML

          for file in android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml; do
            cat > "$file" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/store_icon_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          XML
          done

          test "$(git hash-object icon-192.png)" = "$EXPECTED_ANDROID_192_GIT_BLOB"
          test "$(git hash-object ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png)" = "$EXPECTED_IOS_1024_GIT_BLOB"
          echo 'KORA_OFFICIAL_IDENTITY_INSTALLED=PASS'

      - name: Bump install identity cache key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for path in [Path('manifest.json'), Path('scripts/runtime-tax-transform.mjs'), Path('test/pwa-official-icon.test.js')]:
              text = path.read_text()
              old = 'pwa-rootfix-r1-official'
              new = 'kora-store-icon-r1-official'
              if old not in text:
                  raise SystemExit(f'Missing expected cache key in {path}')
              path.write_text(text.replace(old, new))
          PY

      - name: Add immutable anti-regression identity test
        shell: bash
        run: |
          set -euo pipefail
          cat > test/store-icon-identity.test.js <<'JS'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { existsSync, readFileSync } from 'node:fs';

          const sha256 = (path) => createHash('sha256').update(readFileSync(path)).digest('hex');
          const pngSize = (path) => {
            const b = readFileSync(path);
            assert.equal(b.subarray(1, 4).toString('ascii'), 'PNG', path);
            return [b.readUInt32BE(16), b.readUInt32BE(20)];
          };

          test('KORA exact approved source identity is immutable', () => {
            assert.equal(sha256('icon-192.png'), 'e083d140f053cd45c9de98a24dd4ec8a120a490da51cf5cbae93242dc70b50c6');
            assert.equal(sha256('ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png'), '8fb78e44c886e86036d050bfde9ec0cfbcfc23ecfe61c347f42488ab537b3418');
            assert.deepEqual(readFileSync('icon-192.png'), readFileSync('android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png'));
          });

          test('PWA technical derivatives have required Store sizes', () => {
            assert.deepEqual(pngSize('icon-192.png'), [192, 192]);
            assert.deepEqual(pngSize('icon-512.png'), [512, 512]);
            assert.deepEqual(pngSize('apple-touch-icon.png'), [180, 180]);
          });

          test('Android launcher and adaptive resources use only approved artwork derivatives', () => {
            const launchers = {mdpi:48, hdpi:72, xhdpi:96, xxhdpi:144, xxxhdpi:192};
            const foreground = {mdpi:108, hdpi:162, xhdpi:216, xxhdpi:324, xxxhdpi:432};
            for (const [density, size] of Object.entries(launchers)) {
              const dir = `android/app/src/main/res/mipmap-${density}`;
              assert.deepEqual(pngSize(`${dir}/ic_launcher.png`), [size, size]);
              assert.deepEqual(readFileSync(`${dir}/ic_launcher_round.png`), readFileSync(`${dir}/ic_launcher.png`));
              assert.equal(existsSync(`${dir}/ic_launcher_background.png`), false);
            }
            for (const [density, size] of Object.entries(foreground)) {
              assert.deepEqual(pngSize(`android/app/src/main/res/mipmap-${density}/ic_launcher_foreground.png`), [size, size]);
            }
            const colors = readFileSync('android/app/src/main/res/values/store_icon_colors.xml', 'utf8');
            assert.match(colors, /#FFFFFF/);
            for (const path of ['android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml', 'android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml']) {
              const xml = readFileSync(path, 'utf8');
              assert.match(xml, /@color\/store_icon_background/);
              assert.match(xml, /@mipmap\/ic_launcher_foreground/);
              assert.doesNotMatch(xml, /ic_launcher_background/);
            }
          });
          JS

      - name: Prove regression gates before commit
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run gate
          npm run mobile:build
          npm run mobile:gate
          npm run mobile:tax-parity

          cmp icon-192.png public/icon-192.png
          cmp icon-512.png public/icon-512.png
          cmp apple-touch-icon.png public/apple-touch-icon.png
          cmp icon-192.png www/icon-192.png
          cmp icon-512.png www/icon-512.png
          cmp apple-touch-icon.png www/apple-touch-icon.png

          test "$(git hash-object icon-192.png)" = "$EXPECTED_ANDROID_192_GIT_BLOB"
          test "$(git hash-object ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png)" = "$EXPECTED_IOS_1024_GIT_BLOB"
          echo 'KORA_STORE_ICON_REMEDIATION=PASS'

      - name: Commit identity-only remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KORA Store Gate'
          git config user.email 'mercataxpr@gmail.com'

          git rm .github/workflows/kora-store-icon-finalize-r1.yml
          git rm -r .github/kora-payload .github/kora-payload-v2
          git rm -f .github/KORA_BLOB_PROBE.txt .github/KORA_SOURCE_TRANSFER.md

          git add -A
          git diff --cached --stat
          git diff --cached --name-only | grep -Ev '^(src/domain\.js|src/tax-remediation\.js|src/tax-calendar-contract\.js|src/tax-ui-bridge\.js)$' >/dev/null
          git commit -m 'fix(kora): install exact approved store icon identity'
          git push origin HEAD:kora/store-icon-identity-final-r1
