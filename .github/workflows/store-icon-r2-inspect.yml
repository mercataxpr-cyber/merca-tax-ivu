name: KORA Store Icon R2 Render

on:
  push:
    branches: [mobi-nova/store-icon-identity-r2]
  pull_request:
    branches: [release/store-ready-r1-candidate]

permissions:
  contents: read

jobs:
  render-approved-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reconstruct exact approved source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kora-icon-output/root kora-icon-output/ios kora-icon-output/android
          python3 - <<'PY'
          import base64, glob, hashlib, pathlib, re, struct
          expected='7fbaccec4055a9f314e55e9c91c2f19af9578a1c'
          files=sorted(glob.glob('.github/store-icon-r2/chunks/*.b64'))
          texts=[]
          for p in files:
              raw=pathlib.Path(p).read_text()
              clean=re.sub(r'\s+', '', raw)
              texts.append(clean)
              invalid=re.sub(r'[A-Za-z0-9+/=]', '', clean)
              print(f'{p}: chars={len(clean)} mod4={len(clean)%4} invalid={len(invalid)} head={clean[:8]!r} tail={clean[-8:]!r}')

          def gitblob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def decode_one(s):
              s=re.sub(r'[^A-Za-z0-9+/=]', '', s)
              return base64.b64decode(s + '='*((-len(s))%4), validate=False)

          candidates={}
          try:
              candidates['joined']=decode_one(''.join(texts))
          except Exception as e:
              print('joined decode error:',repr(e))
          try:
              candidates['per_chunk']=b''.join(decode_one(s) for s in texts)
          except Exception as e:
              print('per_chunk decode error:',repr(e))
          try:
              candidates['joined_no_mid_padding']=decode_one(''.join(s.rstrip('=') for s in texts[:-1])+texts[-1])
          except Exception as e:
              print('joined_no_mid_padding decode error:',repr(e))

          chosen=None
          for name,data in candidates.items():
              sha=gitblob(data)
              dims='n/a'
              if len(data)>=24 and data[:8]==b'\x89PNG\r\n\x1a\n':
                  dims='%dx%d'%struct.unpack('>II',data[16:24])
              print(f'{name}: bytes={len(data)} gitblob={sha} dims={dims}')
              if sha==expected:
                  chosen=data
          if chosen is None:
              raise SystemExit('No reconstruction matched the KORA-approved source blob')
          pathlib.Path('kora-icon-output/approved-192.png').write_bytes(chosen)
          print('APPROVED_SOURCE_MATCH=PASS')
          PY

      - name: Render technical sizes without redesign
        shell: bash
        run: |
          set -euo pipefail
          command -v convert >/dev/null 2>&1
          SRC=kora-icon-output/approved-192.png
          cp "$SRC" kora-icon-output/root/icon-192.png
          convert "$SRC" -filter Lanczos -resize 512x512! kora-icon-output/root/icon-512.png
          convert "$SRC" -filter Lanczos -resize 180x180! kora-icon-output/root/apple-touch-icon.png
          convert "$SRC" -filter Lanczos -resize 1024x1024! kora-icon-output/ios/AppIcon-512@2x.png
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density=${spec%%:*}; size=${spec##*:}
            mkdir -p "kora-icon-output/android/$density"
            if [ "$size" = 192 ]; then cp "$SRC" "kora-icon-output/android/$density/ic_launcher.png"; else convert "$SRC" -filter Lanczos -resize "${size}x${size}!" "kora-icon-output/android/$density/ic_launcher.png"; fi
            cp "kora-icon-output/android/$density/ic_launcher.png" "kora-icon-output/android/$density/ic_launcher_round.png"
          done
          for spec in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do
            density=${spec%%:*}; size=${spec##*:}
            convert "$SRC" -filter Lanczos -resize "${size}x${size}!" "kora-icon-output/android/$density/ic_launcher_foreground.png"
          done

      - name: Record hashes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SOURCE_GIT_BLOB=$(git hash-object kora-icon-output/approved-192.png)"
            find kora-icon-output -type f -name '*.png' -print0 | sort -z | while IFS= read -r -d '' f; do
              printf '%s|gitblob=%s|sha256=%s\n' "$f" "$(git hash-object "$f")" "$(sha256sum "$f" | awk '{print $1}')"
            done
          } > kora-icon-output/identity.lock
          cat kora-icon-output/identity.lock

      - uses: actions/upload-artifact@v4
        with:
          name: kora-approved-icon-assets
          path: kora-icon-output
          if-no-files-found: error
