name: NOVA UI Refinement Gate

on:
  push:
    branches:
      - nova/ui-refinement-r1-final
  pull_request:
    branches:
      - mobi/r2-final-parity-gate-remediation
      - integration/mobile-tax-r1-final
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-ui-refinement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ui-refinement:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check vNext UI
        run: node --check src/mobile-vnext-ui.js

      - name: Build web bundle
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Full unit suite
        run: npm test

      - name: Secret scan
        run: npm run secret-scan

      - name: Build and sync mobile web bundle
        shell: bash
        run: |
          set -euo pipefail
          npm run mobile:build
          npx cap sync

      - name: Verify official report logo packaged
        shell: bash
        run: |
          set -euo pipefail
          LOGO="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          test -f "$LOGO"
          test -f "www/$LOGO"
          test -f "android/app/src/main/assets/public/$LOGO"
          test -f "ios/App/App/public/$LOGO"
          echo "OFFICIAL_REPORT_LOGO_PACKAGING=PASS"

      - name: Mobile TAX parity
        run: npm run mobile:tax-parity
