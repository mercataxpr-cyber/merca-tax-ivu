name: NOVA UI Refinement Gate

on:
  pull_request:
    branches:
      - mobi/r2-final-parity-gate-remediation
      - integration/mobile-tax-r1-final
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-ui-refinement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ui-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check vNext UI
        run: node --check src/mobile-vnext-ui.js

      - name: Build web bundle
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Full unit suite
        run: npm test

      - name: Secret scan
        run: npm run secret-scan

      - name: Build mobile web bundle
        run: npm run mobile:build

      - name: Mobile TAX parity
        run: npm run mobile:tax-parity
