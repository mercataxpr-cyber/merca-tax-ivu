name: PWA Official Icon Rootfix R1 Import

on:
  pull_request:
    branches: [release/store-ready-r1-candidate]
    paths:
      - '.github/workflows/pwa-icon-rootfix-r1-import.yml'
      - 'assets/app-icon-approved-r1/**'

permissions:
  contents: write

jobs:
  import-official-icon:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download exact user-approved AppIcons package
        shell: bash
        run: |
          set -euo pipefail
          FILE_ID='1RNCBaWGad_d9wJHT4Mk1q6IHskSXCdmA'
          EXPECTED_SIZE='5316497'
          EXPECTED_SHA='8dd8041143235b96a12f969d6a575623573688e45b0113e5a9b99b9fc5648773'

          python -m pip install --quiet gdown
          rm -f /tmp/AppIcons.zip
          gdown "$FILE_ID" -O /tmp/AppIcons.zip || true

          if [ ! -f /tmp/AppIcons.zip ] || [ "$(stat -c%s /tmp/AppIcons.zip 2>/dev/null || echo 0)" != "$EXPECTED_SIZE" ]; then
            rm -f /tmp/AppIcons.zip
            curl -L --fail --retry 2 -c /tmp/gdrive.cookies \
              -o /tmp/AppIcons.first \
              "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
            if [ "$(stat -c%s /tmp/AppIcons.first)" = "$EXPECTED_SIZE" ]; then
              mv /tmp/AppIcons.first /tmp/AppIcons.zip
            else
              file /tmp/AppIcons.first || true
              echo "Downloaded bytes: $(stat -c%s /tmp/AppIcons.first)"
              echo 'Exact approved ZIP was not obtainable without changing sharing/access. Import aborted.'
              exit 1
            fi
          fi

          test "$(stat -c%s /tmp/AppIcons.zip)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA  /tmp/AppIcons.zip" | sha256sum -c -
          unzip -t /tmp/AppIcons.zip >/dev/null

      - name: Install exact official PWA icon assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/app-icon-approved-r1
          mkdir -p assets/app-icon-approved-r1
          unzip -p /tmp/AppIcons.zip 'android/mipmap-xxxhdpi/ic_launcher.png' > assets/app-icon-approved-r1/icon-192.png
          unzip -p /tmp/AppIcons.zip 'playstore.png' > assets/app-icon-approved-r1/icon-512.png
          unzip -p /tmp/AppIcons.zip 'Assets.xcassets/AppIcon.appiconset//180.png' > assets/app-icon-approved-r1/apple-touch-icon.png

          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          expected = {
              'assets/app-icon-approved-r1/icon-192.png': ((192, 192), 'e083d140f053cd45c9de98a24dd4ec8a120a490da51cf5cbae93242dc70b50c6'),
              'assets/app-icon-approved-r1/icon-512.png': ((512, 512), '144f8f338eafcafeb955c7e8227acd0cb961f5e2fac9907e5c6063a6e7b0d7d3'),
              'assets/app-icon-approved-r1/apple-touch-icon.png': ((180, 180), '7a34b663a33d81aff7086a76c7bafb1d8b66b15453359c0ecddd680cbedfb567'),
          }
          for path, (size, digest) in expected.items():
              data = Path(path).read_bytes()
              if hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f'{path}: SHA-256 mismatch')
              with Image.open(path) as image:
                  if image.size != size:
                      raise SystemExit(f'{path}: expected {size}, got {image.size}')
          PY

      - name: Commit exact official binaries to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MercaTax Icon Gate'
          git config user.email 'mercataxpr@gmail.com'
          git add assets/app-icon-approved-r1
          if git diff --cached --quiet; then
            echo 'Official icon binaries already installed.'
            exit 0
          fi
          git commit -m 'assets(pwa): import exact user-approved AppIcons rootfix r1'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
