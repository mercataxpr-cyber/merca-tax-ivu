name: PWA Official Icon Rootfix R1 Finalize

on:
  push:
    branches:
      - nova/pwa-official-icon-rootfix-r1
    paths:
      - icon-192.png
      - .github/workflows/pwa-rootfix-r1-finalize.yml

permissions:
  contents: write

jobs:
  finalize-official-pwa-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rootfix branch
        uses: actions/checkout@v4
        with:
          ref: nova/pwa-official-icon-rootfix-r1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Derive technical PWA sizes from approved artwork
        shell: bash
        run: |
          set -euo pipefail
          cmp icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          src = Image.open('icon-192.png').convert('RGBA')
          if src.size != (192, 192):
              raise SystemExit(f'Expected 192x192 approved source, got {src.size}')
          for size, target in [(512, 'icon-512.png'), (180, 'apple-touch-icon.png')]:
              image = src.resize((size, size), Image.Resampling.LANCZOS)
              image.save(target, format='PNG', optimize=False, compress_level=9)
          PY

      - name: Validate web and mobile build identity
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --test test/pwa-official-icon.test.js
          cmp icon-192.png public/icon-192.png
          cmp icon-512.png public/icon-512.png
          cmp apple-touch-icon.png public/apple-touch-icon.png
          node scripts/build-mobile.mjs
          cmp icon-192.png www/icon-192.png
          cmp icon-512.png www/icon-512.png
          cmp apple-touch-icon.png www/apple-touch-icon.png

      - name: Commit finalized PWA identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MercaTax PWA Rootfix'
          git config user.email 'mercataxpr@gmail.com'
          git add icon-192.png icon-512.png apple-touch-icon.png
          git rm .github/workflows/pwa-rootfix-r1-finalize.yml
          git commit -m 'fix(pwa): finalize official install icon identity r1'
          git push origin HEAD:nova/pwa-official-icon-rootfix-r1

# One-shot validation workflow. It removes itself after a successful run.
