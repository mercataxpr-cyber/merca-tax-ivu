name: MercaTax Android release (APK + AAB) - one shot

on:
  push:
    branches:
      - build/mercatax-android-release-20261113

permissions:
  contents: read

concurrency:
  group: mercatax-android-release-one-shot
  cancel-in-progress: false

jobs:
  android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CERTIFIED_SHA: 4efc962976e3ebb92c8d5ddfe1deb5dfc4a98f18
    steps:
      - name: Checkout exact merged main SHA
        uses: actions/checkout@v4
        with:
          ref: 4efc962976e3ebb92c8d5ddfe1deb5dfc4a98f18
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the build source is current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$CERTIFIED_SHA"
          echo "CERTIFIED_MAIN_SHA=$CERTIFIED_SHA"

      - name: Require official Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing GitHub Actions secret: $name"; missing=1; fi
          done
          test "$missing" -eq 0
          echo "ANDROID_SIGNING_SECRETS_PRESENT=PASS"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate and materialize native runtime from official icon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run lint
          npm test
          npm run secret-scan
          npm run mobile:build
          npm run mobile:gate
          npx cap sync
          npm run mobile:tax-parity
          test ! -e logo.png
          test ! -e www/logo.png

      - name: Prepare upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mercatax-upload.jks"
          test -s "$RUNNER_TEMP/mercatax-upload.jks"
          chmod 600 "$RUNNER_TEMP/mercatax-upload.jks"

      - name: Build signed release AAB and APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mercatax-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease assembleRelease --no-daemon --console=plain
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify signatures, identity, version and official icon
        shell: bash
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          jarsigner -verify -strict "$AAB" | tee /tmp/aab-verify.txt
          grep -q "jar verified" /tmp/aab-verify.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apk-verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apk-verify.txt
          APK_CERT=$(grep -m1 "Signer #1 certificate SHA-256 digest" /tmp/apk-verify.txt | awk '{print $NF}')
          AAB_CERT=$(keytool -printcert -jarfile "$AAB" | grep -m1 "SHA256:" | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK_CERT_SHA256=$APK_CERT"
          echo "AAB_CERT_SHA256=$AAB_CERT"
          test -n "$APK_CERT" && test "$APK_CERT" = "$AAB_CERT"
          if keytool -printcert -jarfile "$AAB" | grep -qi "Android Debug"; then echo "::error::Debug certificate"; exit 1; fi
          "$BT/aapt2" dump badging "$APK" > /tmp/badging.txt
          grep -q "package: name='com.mercatax.ivupr' versionCode='2' versionName='1.0.1'" /tmp/badging.txt
          grep -q "application-label:'MercaTax IVU PR'" /tmp/badging.txt
          grep -q "application-icon-640:'res/mipmap-anydpi-v26/ic_launcher.xml'" /tmp/badging.txt
          mkdir -p /tmp/apk /tmp/aab
          unzip -q "$APK" -d /tmp/apk
          unzip -q "$AAB" -d /tmp/aab
          cmp icon-512.png /tmp/apk/assets/public/icon-512.png
          cmp icon-512.png /tmp/aab/base/assets/public/icon-512.png
          # Launcher/adaptive bitmaps are regenerated from icon-512.png by mobile:build; AAPT2 may
          # recompress them, so presence is gated here and pixels are inspected on the downloaded files.
          for d in ldpi mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              test -s "/tmp/apk/res/mipmap-$d-v4/$f.png"
              test -s "/tmp/aab/base/res/mipmap-$d-v4/$f.png"
            done
          done
          ! find /tmp/apk /tmp/aab -iname 'logo.png' | grep -q .
          ! find /tmp/apk /tmp/aab -iname 'teki-report-fix*' | grep -q .
          grep -q "installMenuBackButton" /tmp/apk/assets/public/mobile-native.js
          grep -q "vxMenuList" /tmp/apk/assets/public/src/mobile-vnext-ui.js
          ! grep -Eqi 'googletagmanager\.com|gtag\(' /tmp/apk/assets/public/index.html
          sha256sum "$AAB" "$APK"
          cp "$AAB" "MercaTax-IVU-PR-1.0.1-vc2-release.aab"
          cp "$APK" "MercaTax-IVU-PR-1.0.1-vc2-release-signed.apk"
          echo "MERCATAX_ANDROID_RELEASE_VERIFIED=PASS"

      - name: Upload signed Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: MercaTax-IVU-PR-1.0.1-vc2-google-play-aab-${{ env.CERTIFIED_SHA }}
          path: MercaTax-IVU-PR-1.0.1-vc2-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed Samsung APK
        uses: actions/upload-artifact@v4
        with:
          name: MercaTax-IVU-PR-1.0.1-vc2-samsung-apk-${{ env.CERTIFIED_SHA }}
          path: MercaTax-IVU-PR-1.0.1-vc2-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mercatax-upload.jks"
