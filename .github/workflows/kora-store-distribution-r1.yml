name: KORA Store Distribution R1

on:
  workflow_run:
    workflows:
      - KORA Store Ready R2
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      certified_sha:
        description: Certified main SHA to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kora-store-distribution-${{ github.event.workflow_run.head_sha || inputs.certified_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build-upload-ready:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CERTIFIED_SHA: ${{ github.event.workflow_run.head_sha || inputs.certified_sha || github.sha }}
    steps:
      - name: Checkout exact certified candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERTIFIED_SHA }}
          fetch-depth: 0

      - name: Prove exact certified main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$CERTIFIED_SHA"
          echo "CERTIFIED_SHA=$CERTIFIED_SHA"

      - name: Require distribution credentials
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in             ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD             APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0
          echo "DISTRIBUTION_CREDENTIALS_PRESENT=PASS"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install and materialize certified native runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run mobile:build
          npm run mobile:gate
          npx cap sync
          npm run mobile:tax-parity

      - name: Prepare Android upload signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/mercatax-upload.jks
          test -s /tmp/mercatax-upload.jks
          chmod 600 /tmp/mercatax-upload.jks

      - name: Build signed Google Play AAB
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: /tmp/mercatax-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease --no-daemon
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          jarsigner -verify -strict -verbose "$AAB" >/tmp/aab-signature.txt
          grep -q "jar verified" /tmp/aab-signature.txt
          echo "ANDROID_SIGNED_AAB=PASS"

      - name: Prepare Apple distribution signing
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="/tmp/mercatax-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > /tmp/mercatax-distribution.p12
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/mercatax.mobileprovision
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import /tmp/mercatax-distribution.p12 -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          security cms -D -i /tmp/mercatax.mobileprovision > /tmp/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/mercatax.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_MATERIAL=PASS"

      - name: Archive signed iOS Release
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          rm -rf /tmp/MercaTaxIVUPR.xcarchive
          xcodebuild             -project ios/App/App.xcodeproj             -scheme App             -configuration Release             -destination 'generic/platform=iOS'             -archivePath /tmp/MercaTaxIVUPR.xcarchive             DEVELOPMENT_TEAM="$APPLE_TEAM_ID"             CODE_SIGN_STYLE=Manual             CODE_SIGN_IDENTITY="Apple Distribution"             PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"             archive
          APP="/tmp/MercaTaxIVUPR.xcarchive/Products/Applications/App.app"
          test -d "$APP"
          codesign --verify --deep --strict "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.mercatax.ivupr"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "1.0.0"
          echo "IOS_SIGNED_ARCHIVE=PASS"

      - name: Export App Store Connect IPA
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.mercatax.ivupr</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          rm -rf /tmp/mercatax-export
          xcodebuild -exportArchive             -archivePath /tmp/MercaTaxIVUPR.xcarchive             -exportPath /tmp/mercatax-export             -exportOptionsPlist /tmp/ExportOptions.plist
          IPA="$(find /tmp/mercatax-export -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          test -f "$IPA"
          cp "$IPA" /tmp/MercaTax-IVU-PR-1.0.0.ipa
          echo "IOS_APP_STORE_IPA=PASS"

      - name: Verify upload-ready artifacts
        shell: bash
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          IPA="/tmp/MercaTax-IVU-PR-1.0.0.ipa"
          test -f "$AAB"
          test -f "$IPA"
          echo "ANDROID_AAB_SHA256=$(shasum -a 256 "$AAB" | awk '{print $1}')"
          echo "IOS_IPA_SHA256=$(shasum -a 256 "$IPA" | awk '{print $1}')"
          echo "KORA_UPLOAD_READY=PASS"

      - name: Upload Google Play artifact
        uses: actions/upload-artifact@v4
        with:
          name: mercatax-google-play-${{ env.CERTIFIED_SHA }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload App Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: mercatax-app-store-${{ env.CERTIFIED_SHA }}
          path: /tmp/MercaTax-IVU-PR-1.0.0.ipa
          if-no-files-found: error

      - name: Verify clean certified source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"
          echo "KORA_DISTRIBUTION_SOURCE_CLEAN=PASS"
