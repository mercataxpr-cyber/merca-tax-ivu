apply plugin: 'com.android.application'

import javax.imageio.ImageIO
import java.awt.RenderingHints
import java.awt.image.BufferedImage

android {
    namespace = "com.mercatax.ivupr"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mercatax.ivupr"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58c72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Android launcher icons are generated from the one canonical approved store icon.
// Do not keep hand-maintained or legacy launcher PNGs in res/mipmap-*.
def officialLauncherIcon = file("${rootProject.projectDir}/../app-icon-official.png")
def launcherSizes = [ldpi: 36, mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192]

tasks.register('generateOfficialLauncherIcons') {
    inputs.file(officialLauncherIcon)
    outputs.files(launcherSizes.collectMany { density, size ->
        [file("src/main/res/mipmap-${density}/ic_launcher.png"), file("src/main/res/mipmap-${density}/ic_launcher_round.png")]
    })
    doLast {
        if (!officialLauncherIcon.exists()) {
            throw new GradleException("Canonical store icon missing: ${officialLauncherIcon}")
        }
        def source = ImageIO.read(officialLauncherIcon)
        if (source == null) {
            throw new GradleException("Canonical store icon is not a readable PNG: ${officialLauncherIcon}")
        }
        launcherSizes.each { density, size ->
            def targetDir = file("src/main/res/mipmap-${density}")
            targetDir.mkdirs()
            def scaled = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB)
            def graphics = scaled.createGraphics()
            try {
                graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC)
                graphics.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY)
                graphics.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
                graphics.drawImage(source, 0, 0, size, size, null)
            } finally {
                graphics.dispose()
            }
            ImageIO.write(scaled, 'png', new File(targetDir, 'ic_launcher.png'))
            ImageIO.write(scaled, 'png', new File(targetDir, 'ic_launcher_round.png'))
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('generateOfficialLauncherIcons')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
